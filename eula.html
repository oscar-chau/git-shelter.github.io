<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Caritas EULA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 1rem;
      line-height: 1.6;
      color: #222;
    }
    h1, h2 {
      color: #111827;
    }

    /* Language Toggle */
    .lang-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #111827;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 0;
      z-index: 999;
      box-sizing: border-box;
    }

    body {
      padding-top: 3rem;
    }

    .lang-btn {
      background: transparent;
      color: #9ca3af;
      border: 1px solid #374151;
      padding: 0.3rem 0.85rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      letter-spacing: 0.03em;
    }

    .lang-btn:first-child {
      border-radius: 6px 0 0 6px;
      border-right: none;
    }

    .lang-btn:last-child {
      border-radius: 0 6px 6px 0;
      border-left: none;
    }

    .lang-btn:not(:first-child):not(:last-child) {
      border-left: 1px solid #374151;
      border-right: 1px solid #374151;
    }

    .lang-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .lang-btn:not(.active):hover {
      background: #1f2937;
      color: #e5e7eb;
    }
  </style>
</head>
<body>

  <div class="lang-bar">
    <button class="lang-btn active" onclick="setLanguage('ca')" id="btn-ca">CAT</button>
    <button class="lang-btn" onclick="setLanguage('es')" id="btn-es">ES</button>
    <button class="lang-btn" onclick="setLanguage('en')" id="btn-en">EN</button>
  </div>

  <h1 data-i18n="title"></h1>
  <p data-i18n="intro1"></p>
  <p data-i18n="intro2"></p>
  <p data-i18n="intro3"></p>

  <h2 data-i18n="license.title"></h2>
  <p data-i18n="license.grant"></p>
  <p data-i18n="license.mayLabel"></p>
  <ul>
    <li data-i18n="license.may1"></li>
    <li data-i18n="license.may2"></li>
  </ul>
  <p data-i18n="license.mayNotLabel"></p>
  <ul>
    <li data-i18n="license.mayNot1"></li>
    <li data-i18n="license.mayNot2"></li>
    <li data-i18n="license.mayNot3"></li>
    <li data-i18n="license.mayNot4"></li>

  <h2 data-i18n="ip.title"></h2>

  <h2 data-i18n="termination.title"></h2>

  <p data-i18n="termination.body2"></p>

  <h2 data-i18n="warranty.title"></h2>

    function setLanguage(lang) {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
      document.documentElement.lang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + lang).classList.add('active');
      localStorage.setItem('caritasLang', lang);
    }

    const savedLang = localStorage.getItem('caritasLang') || 'ca';
    setLanguage(savedLang);
  </script>
</body>
</html>
